user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream blog_backend {
        # 容器使用 host 网络，因此该地址就是宿主机 Java 服务。
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        # Cloudflare 回源 HTTPS 目前会被云厂商按域名 SNI 重置。80 临时提供同一套内容，
        # 让 Cloudflare Flexible 模式可以继续向访客提供可信 HTTPS；备案/拦截解除后再恢复跳转。
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name blog.45205044.xyz;

        # 证书由 deploy/scripts/enable_https.sh 使用 Certbot 容器签发和续签。
        ssl_certificate /etc/letsencrypt/live/blog.45205044.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/blog.45205044.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        root /srv/release/web;
        index index.html;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # 仅在 HTTPS 虚拟主机上启用，防止浏览器降级回明文 HTTP。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://blog_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /uploads/ {
            proxy_pass http://blog_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            expires 7d;
        }

        location = /admin {
            return 301 /admin/;
        }

        # 管理端静态资源使用内容哈希，可以长期缓存；root 会把 /admin/ 映射到发布目录的 admin/。
        location ^~ /admin/assets/ {
            root /srv/release;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 管理端构建产物本身使用 /admin/ 作为资源和 Router 基址。
        location ^~ /admin/ {
            root /srv/release;
            try_files $uri $uri/ /admin/index.html;
        }

        location ~* ^/assets/.+\.(css|js|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location = /admin/index.html {
            root /srv/release;
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
