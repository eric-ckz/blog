spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:blog_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

blog:
  jwt:
    secret: test-secret-that-is-longer-than-thirty-two-characters
    issuer: charles-blog-test
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-name: blog_refresh_token
    secure-cookie: false
  storage:
    type: local
    root: ./target/test-uploads
    max-size: 10MB
  cors:
    allowed-origins: http://localhost:3100
  bootstrap-admin:
    username: test-admin
    password: test-password-123
    display-name: 测试管理员
