spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL}
    username: ${BLOG_DB_USERNAME}
    password: ${BLOG_DB_PASSWORD}

blog:
  jwt:
    # HTTPS 环境必须保持 true；首次仅使用 IP+HTTP 部署时由环境变量显式关闭。
    secure-cookie: ${BLOG_SECURE_COOKIE:true}

logging:
  file:
    # 生产日志写入持久化目录，避免版本切换时丢失。
    name: ${BLOG_LOG_FILE:./logs/blog-server.log}
  level:
    root: info
    com.eric.blog: info
