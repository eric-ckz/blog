server:
  port: 8080

spring:
  application:
    name: blog-server
  profiles:
    default: dev
  servlet:
    multipart:
      # Web 层先限制请求大小，存储层还会再次校验真实文件大小和内容。
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /doc.html

blog:
  jwt:
    # JWT 密钥没有默认值，防止测试密钥被误用于正式环境。
    secret: ${BLOG_JWT_SECRET}
    issuer: charles-blog
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-name: blog_refresh_token
    secure-cookie: false
  storage:
    type: local
    # 相对路径固定以 blog-server 模块目录为基准；部署时可通过环境变量传入绝对路径。
    root: ${BLOG_STORAGE_ROOT:./uploads}
    max-size: 10MB
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3100}
  bootstrap-admin:
    username: ${BLOG_ADMIN_USERNAME:}
    password: ${BLOG_ADMIN_PASSWORD:}
    display-name: ${BLOG_ADMIN_DISPLAY_NAME:博客管理员}
